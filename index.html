<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Harsha Crafts & Gifts — Thoughtful Gifts, Beautifully Crafted</title>
<meta name="description" content="Personalized gifts, handmade crafts and custom keepsakes for every celebration. Pan-India delivery. Order online or on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,450;1,9..144,600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF6EC;
    --paper:#FFFDF9;
    --espresso:#2B1B14;
    --espresso-soft:#5A473F;
    --wine:#7C2233;
    --wine-deep:#5C1725;
    --gold:#B4863A;
    --gold-soft:#E7D3AA;
    --forest:#33463A;
    --line: rgba(43,27,20,0.12);
    --shadow: 0 10px 30px rgba(43,27,20,0.10);
    --shadow-soft: 0 6px 18px rgba(43,27,20,0.08);
    --radius-arch: 120px 120px 14px 14px;
    --maxw: 1180px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--ivory);
    color:var(--espresso);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  h1,h2,h3,h4{font-family:'Fraunces', serif; font-weight:600; line-height:1.1; color:var(--espresso);}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 30px; border-radius:100px; font-size:15px; font-weight:600;
    letter-spacing:0.01em; transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--wine); color:#fff; box-shadow:0 8px 20px rgba(124,34,51,0.28);}
  .btn-primary:hover{ background:var(--wine-deep); transform:translateY(-2px); box-shadow:0 12px 26px rgba(124,34,51,0.34);}
  .btn-outline{ background:transparent; color:var(--espresso); border:1.5px solid var(--espresso); }
  .btn-outline:hover{ background:var(--espresso); color:var(--ivory); }
  .btn-whatsapp{ background:#2F5B44; color:#fff; box-shadow:0 8px 20px rgba(47,91,68,0.28);}
  .btn-whatsapp:hover{ background:#274c39; transform:translateY(-2px);}
  .btn-gold{ background:var(--gold); color:#fff; box-shadow:0 8px 20px rgba(180,134,58,0.3);}
  .btn-gold:hover{ background:#9c7331; transform:translateY(-2px);}
  .eyebrow{ font-size:14px; color:var(--wine); font-family:'Fraunces', serif; font-style:italic; font-weight:500; margin-bottom:10px; display:block;}
  section{ padding:88px 0; }
  @media(max-width:720px){ section{ padding:56px 0; } }

  /* ===== NAVBAR ===== */
  header#site-header{
    position:sticky; top:0; z-index:200;
    background:rgba(251,246,236,0.88);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease, box-shadow .3s ease, padding .3s ease;
  }
  header#site-header.scrolled{ border-bottom-color:var(--line); box-shadow:0 4px 24px rgba(43,27,20,0.06); }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; max-width:var(--maxw); margin:0 auto; transition:padding .3s ease;}
  header#site-header.scrolled .nav-inner{ padding:12px 24px; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-mark{ width:38px; height:38px; border-radius:50%; background:var(--wine); display:flex; align-items:center; justify-content:center; color:var(--gold-soft); font-family:'Fraunces',serif; font-weight:700; font-size:17px; flex-shrink:0;}
  .logo-text{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; letter-spacing:0.01em; line-height:1.1;}
  .logo-text span{ display:block; font-family:'Work Sans',sans-serif; font-size:10.5px; font-weight:500; color:var(--espresso-soft); letter-spacing:0.06em; margin-top:2px;}
  nav.main-nav{ display:flex; gap:34px; }
  nav.main-nav a{ font-size:14.5px; font-weight:500; color:var(--espresso-soft); position:relative; padding:4px 0; transition:color .2s ease;}
  nav.main-nav a:hover, nav.main-nav a.active{ color:var(--wine); }
  nav.main-nav a::after{ content:''; position:absolute; left:0; bottom:-4px; width:0; height:2px; background:var(--gold); transition:width .25s ease;}
  nav.main-nav a:hover::after, nav.main-nav a.active::after{ width:100%; }
  .nav-actions{ display:flex; align-items:center; gap:6px; }
  .icon-btn{ width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--espresso); transition:background .2s ease; position:relative;}
  .icon-btn:hover{ background:rgba(43,27,20,0.06); }
  .icon-btn svg{ width:20px; height:20px; }
  .badge-count{ position:absolute; top:2px; right:2px; background:var(--wine); color:#fff; font-size:10px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .nav-wa{ display:flex; align-items:center; gap:7px; background:#2F5B44; color:#fff; padding:9px 18px; border-radius:100px; font-size:13.5px; font-weight:600; margin-left:6px;}
  .nav-wa svg{ width:15px; height:15px; }
  .hamburger{ display:none; width:40px; height:40px; align-items:center; justify-content:center; }
  @media(max-width:900px){
    nav.main-nav{ display:none; }
    .nav-wa span{ display:none; }
    .nav-wa{ padding:10px; border-radius:50%; }
    .hamburger{ display:flex; }
  }

  .mobile-menu{ position:fixed; inset:0; background:var(--ivory); z-index:300; transform:translateX(100%); transition:transform .35s ease; padding:24px; overflow-y:auto;}
  .mobile-menu.open{ transform:translateX(0); }
  .mobile-menu-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;}
  .mobile-menu a{ display:block; font-family:'Fraunces',serif; font-size:26px; padding:14px 0; border-bottom:1px solid var(--line); color:var(--espresso);}

  /* ===== SEARCH OVERLAY ===== */
  .search-overlay{ position:fixed; inset:0; background:rgba(43,27,20,0.5); z-index:400; opacity:0; pointer-events:none; transition:opacity .25s ease; display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;}
  .search-overlay.open{ opacity:1; pointer-events:auto; }
  .search-box{ background:var(--paper); width:min(560px,90vw); border-radius:20px; padding:10px; box-shadow:0 30px 60px rgba(0,0,0,0.3); transform:translateY(-16px); transition:transform .3s ease;}
  .search-overlay.open .search-box{ transform:translateY(0); }
  .search-box input{ width:100%; border:none; background:transparent; font-family:'Fraunces',serif; font-size:22px; padding:16px 18px; outline:none; color:var(--espresso);}
  .search-results{ max-height:50vh; overflow-y:auto; border-top:1px solid var(--line); }
  .search-results-item{ display:flex; gap:12px; align-items:center; padding:12px 18px; }
  .search-results-item img{ width:48px; height:48px; border-radius:10px; object-fit:cover; }
  .search-results-item .name{ font-size:14px; font-weight:600; }
  .search-results-item .price{ font-size:13px; color:var(--wine); }

  /* ===== HERO ===== */
  .hero{ padding:64px 0 40px; position:relative; overflow:hidden; }
  .hero::before{
    content:''; position:absolute; top:-120px; right:-160px; width:480px; height:480px; border-radius:50%;
    background:radial-gradient(circle, rgba(180,134,58,0.16), transparent 70%); z-index:0;
  }
  .hero-grid{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center; position:relative; z-index:1;}
  @media(max-width:900px){ .hero-grid{ grid-template-columns:1fr; gap:40px; } }
  .hero-copy .ig-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); padding:8px 16px 8px 8px; border-radius:100px; font-size:13px; font-weight:600; box-shadow:var(--shadow-soft); margin-bottom:22px;}
  .ig-chip .dot{ width:26px; height:26px; border-radius:50%; background:linear-gradient(45deg,#7C2233,#B4863A); display:flex; align-items:center; justify-content:center;}
  .ig-chip .dot svg{ width:14px; height:14px; color:#fff; }
  .hero-copy h1{ font-size:clamp(34px,4.6vw,58px); letter-spacing:-0.01em; margin-bottom:22px; max-width:11.5ch;}
  .hero-copy p.lead{ font-size:17.5px; color:var(--espresso-soft); max-width:46ch; margin-bottom:32px;}
  .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:36px;}
  .hero-stats{ display:flex; gap:32px; flex-wrap:wrap; padding-top:28px; border-top:1px solid var(--line);}
  .hero-stats .stat b{ display:block; font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--wine);}
  .hero-stats .stat span{ font-size:12.5px; color:var(--espresso-soft); }
  .hero-visual{ position:relative; }
  .arch-frame{ border-radius:var(--radius-arch); overflow:hidden; box-shadow:var(--shadow); aspect-ratio:3/3.6; position:relative;}
  .arch-frame img{ width:100%; height:100%; object-fit:cover; }
  .floating-card{ position:absolute; background:var(--paper); border-radius:18px; padding:14px 18px; box-shadow:0 16px 40px rgba(43,27,20,0.18); display:flex; align-items:center; gap:12px; animation:floatY 4.5s ease-in-out infinite;}
  .floating-card.fc1{ bottom:-6%; left:-9%; }
  .floating-card.fc2{ top:8%; right:-10%; }
  @media(max-width:640px){ .floating-card.fc1{ left:-3%; } .floating-card.fc2{ right:-3%; } .floating-card{ padding:10px 14px; } }
  .floating-card .fc-icon{ width:38px; height:38px; border-radius:50%; background:var(--forest); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
  .floating-card .fc-icon svg{ width:18px; height:18px;}
  .floating-card b{ display:block; font-family:'Fraunces',serif; font-size:15px; }
  .floating-card span{ font-size:11.5px; color:var(--espresso-soft); }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  @media (prefers-reduced-motion: reduce){ .floating-card{ animation:none; } }

  /* ===== TRUST BAR ===== */
  .trust-bar{ background:var(--espresso); color:var(--ivory); padding:26px 0; }
  .trust-inner{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px; }
  .trust-item{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:500; color:var(--gold-soft); flex:1; min-width:180px; justify-content:center;}
  .trust-item svg{ width:19px; height:19px; flex-shrink:0; }
  @media(max-width:720px){ .trust-item{ justify-content:flex-start; min-width:45%;} }

  /* ===== SECTION HEAD ===== */
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:40px; flex-wrap:wrap;}
  .section-head h2{ font-size:clamp(26px,3.2vw,38px); max-width:16ch;}
  .section-head p{ color:var(--espresso-soft); max-width:44ch; font-size:15.5px; }
  .view-all-link{ display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:14px; color:var(--wine); border-bottom:1.5px solid var(--wine); padding-bottom:2px; flex-shrink:0;}

  /* ===== CATEGORIES ===== */
  .cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
  @media(max-width:980px){ .cat-grid{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:520px){ .cat-grid{ grid-template-columns:1fr 1fr; gap:14px;} }
  .cat-card{ position:relative; border-radius:var(--radius-arch); overflow:hidden; aspect-ratio:3/3.8; box-shadow:var(--shadow-soft); transition:transform .3s ease, box-shadow .3s ease; cursor:pointer;}
  .cat-card:hover{ transform:translateY(-6px); box-shadow:var(--shadow); }
  .cat-card img{ width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
  .cat-card:hover img{ transform:scale(1.06); }
  .cat-card::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(43,27,20,0.82) 0%, rgba(43,27,20,0.1) 55%, transparent 75%);}
  .cat-card-body{ position:absolute; left:0; right:0; bottom:0; padding:20px; z-index:2; color:#fff;}
  .cat-card-body h3{ color:#fff; font-size:19px; margin-bottom:6px;}
  .cat-card-body .explore{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--gold-soft);}

  /* ===== PRODUCT GRID ===== */
  .prod-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
  @media(max-width:980px){ .prod-grid{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:560px){ .prod-grid{ grid-template-columns:repeat(2,1fr); gap:12px;} }
  .prod-card{ background:var(--paper); border-radius:20px; overflow:hidden; box-shadow:var(--shadow-soft); transition:transform .3s ease, box-shadow .3s ease; border:1px solid var(--line); display:flex; flex-direction:column;}
  .prod-card:hover{ transform:translateY(-5px); box-shadow:var(--shadow); }
  .prod-media{ position:relative; aspect-ratio:1/1; overflow:hidden; cursor:pointer;}
  .prod-media img{ width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
  .prod-card:hover .prod-media img{ transform:scale(1.08); }
  .wish-btn{ position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:50%; background:rgba(255,253,249,0.92); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.12); z-index:2;}
  .wish-btn svg{ width:17px; height:17px; color:var(--espresso); transition:all .2s ease;}
  .wish-btn.active svg{ color:var(--wine); fill:var(--wine); }
  .prod-tag{ position:absolute; top:12px; left:12px; background:var(--wine); color:#fff; font-size:10.5px; font-weight:700; padding:5px 11px; border-radius:100px; letter-spacing:0.02em; z-index:2;}
  .prod-body{ padding:16px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .prod-cat{ font-size:11.5px; color:var(--gold); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
  .prod-name{ font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; cursor:pointer;}
  .prod-price-row{ display:flex; align-items:baseline; gap:8px; margin-top:2px;}
  .prod-price{ font-size:16px; font-weight:700; color:var(--espresso);}
  .prod-price-old{ font-size:13px; color:var(--espresso-soft); text-decoration:line-through;}
  .prod-price-note{ font-size:11px; color:var(--espresso-soft); font-style:italic; }
  .prod-actions{ display:flex; gap:8px; margin-top:10px;}
  .prod-actions .btn{ padding:10px 14px; font-size:13px; flex:1;}

  /* ===== PERSONALIZE SECTION ===== */
  .personalize{ background:var(--wine); color:var(--ivory); border-radius:36px; margin:0 24px; padding:70px 40px;}
  @media(max-width:720px){ .personalize{ margin:0 12px; padding:48px 22px; } }
  .personalize-inner{ max-width:var(--maxw); margin:0 auto;}
  .personalize h2{ color:#fff; font-size:clamp(28px,4vw,42px); text-align:center; margin-bottom:12px;}
  .personalize > .personalize-inner > p{ text-align:center; color:var(--gold-soft); max-width:50ch; margin:0 auto 48px; font-size:15.5px;}
  .steps-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px;}
  @media(max-width:860px){ .steps-row{ grid-template-columns:1fr 1fr; } }
  @media(max-width:520px){ .steps-row{ grid-template-columns:1fr; } }
  .step{ text-align:center; }
  .step-num{ width:52px; height:52px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.35); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:19px; margin:0 auto 16px; color:var(--gold-soft);}
  .step h4{ color:#fff; font-size:16px; margin-bottom:6px; }
  .step p{ font-size:13.5px; color:rgba(255,255,255,0.7); }
  .personalize-cta{ text-align:center; margin-top:44px; }

  /* ===== INSTAGRAM ===== */
  .insta-head{ text-align:center; margin-bottom:40px; }
  .insta-head h2{ font-size:clamp(26px,3.4vw,38px); }
  .insta-head p{ color:var(--espresso-soft); margin-top:10px;}
  .insta-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  @media(max-width:900px){ .insta-grid{ grid-template-columns:repeat(3,1fr); } }
  .insta-item{ aspect-ratio:1/1; border-radius:14px; overflow:hidden; position:relative; cursor:pointer;}
  .insta-item img{ width:100%; height:100%; object-fit:cover; transition:transform .4s ease;}
  .insta-item:hover img{ transform:scale(1.1); }
  .insta-item::after{ content:''; position:absolute; inset:0; background:rgba(43,27,20,0); transition:background .3s ease;}
  .insta-item:hover::after{ background:rgba(43,27,20,0.35); }
  .insta-item svg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); width:26px; height:26px; color:#fff; opacity:0; transition:all .3s ease;}
  .insta-item:hover svg{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .insta-cta{ text-align:center; margin-top:36px; }

  /* ===== WHY CHOOSE US ===== */
  .why-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  @media(max-width:860px){ .why-grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:520px){ .why-grid{ grid-template-columns:1fr; } }
  .why-card{ background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:30px 26px; transition:transform .25s ease, box-shadow .25s ease;}
  .why-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); }
  .why-icon{ width:48px; height:48px; border-radius:14px; background:var(--forest); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}
  .why-icon svg{ width:23px; height:23px; color:var(--gold-soft); }
  .why-card h4{ font-size:17px; margin-bottom:8px;}
  .why-card p{ font-size:14px; color:var(--espresso-soft); }

  /* ===== OCCASIONS ===== */
  .occ-scroll{ display:flex; gap:16px; overflow-x:auto; padding-bottom:12px; scroll-snap-type:x mandatory; margin:0 -24px; padding-left:24px; padding-right:24px;}
  .occ-scroll::-webkit-scrollbar{ height:6px; }
  .occ-scroll::-webkit-scrollbar-thumb{ background:var(--gold-soft); border-radius:10px; }
  .occ-card{ flex:0 0 200px; scroll-snap-align:start; border-radius:18px; overflow:hidden; position:relative; aspect-ratio:3/3.6; box-shadow:var(--shadow-soft);}
  .occ-card img{ width:100%; height:100%; object-fit:cover;}
  .occ-card::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(43,27,20,0.78), transparent 60%);}
  .occ-card span{ position:absolute; left:16px; bottom:16px; color:#fff; font-family:'Fraunces',serif; font-size:17px; z-index:2;}

  /* ===== HOW TO ORDER ===== */
  .order-flow{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:48px; flex-wrap:wrap;}
  .order-step{ display:flex; flex-direction:column; align-items:center; gap:10px; flex:1; min-width:110px;}
  .order-step .circle{ width:64px; height:64px; border-radius:50%; background:var(--paper); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-soft);}
  .order-step .circle svg{ width:26px; height:26px; color:var(--wine); }
  .order-step span{ font-size:13.5px; font-weight:600; }
  .order-arrow{ color:var(--gold); flex-shrink:0; align-self:center; }
  .order-arrow svg{ width:22px; height:22px; }
  @media(max-width:760px){ .order-arrow{ display:none; } .order-flow{ justify-content:center; } .order-step{ flex:0 0 30%; } }
  .order-help{ background:var(--paper); border:1px solid var(--line); border-radius:24px; padding:36px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;}
  .order-help h3{ font-size:20px; margin-bottom:6px; }
  .order-help p{ color:var(--espresso-soft); font-size:14.5px; }

/* ===== WHATSAPP CTA ===== */
  .wa-cta{ position:relative; border-radius:36px; margin:0 24px; overflow:hidden; background:var(--forest); padding:64px 40px; text-align:center;}
  @media(max-width:720px){ .wa-cta{ margin:0 12px; padding:48px 22px; } }
  .wa-cta h2{ color:#fff; font-size:clamp(26px,3.6vw,38px); margin-bottom:14px;}
  .wa-cta p{ color:rgba(255,255,255,0.75); max-width:46ch; margin:0 auto 30px; font-size:15.5px;}

  /* ===== FOOTER ===== */
  footer{ background:var(--espresso); color:rgba(251,246,236,0.72); padding:64px 0 26px; margin-top:40px;}
  .footer-grid{ display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:40px; padding-bottom:44px; border-bottom:1px solid rgba(251,246,236,0.12);}
  @media(max-width:820px){ .footer-grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:520px){ .footer-grid{ grid-template-columns:1fr; } }
  .footer-brand .logo-text{ color:var(--ivory); }
  .footer-brand p{ margin-top:14px; font-size:13.5px; max-width:32ch; }
  .footer-col h5{ color:var(--ivory); font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:16px;}
