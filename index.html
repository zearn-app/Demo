<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Hero 💚</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: radial-gradient(circle at center, #0f0f0f, #000);
  overflow: hidden;
  color: white;
}

/* Background particles */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* Center Content */
.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* Glowing Title */
h1 {
  font-size: 2.5rem;
  color: #00ff88;
  text-shadow: 0 0 20px #00ff88;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #00ff88; }
  to { text-shadow: 0 0 30px #00ff88; }
}

/* Omnitrix Circle */
.omnitrix {
  width: 150px;
  height: 150px;
  border: 6px solid #00ff88;
  border-radius: 50%;
  margin: 20px 0;
  position: relative;
  box-shadow: 0 0 25px #00ff88;
  animation: rotate 6s linear infinite;
}

.omnitrix::before {
  content: "";
  position: absolute;
  width: 60px;
  height: 60px;
  background: #00ff88;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

@keyframes rotate {
  100% { transform: rotate(360deg); }
}

/* Message */
.message {
  max-width: 300px;
  font-size: 1rem;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 2s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Button */
button {
  margin-top: 20px;
  padding: 10px 25px;
  border: none;
  background: #00ff88;
  color: black;
  font-weight: bold;
  border-radius: 25px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px #00ff88;
}

/* Popup */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: 0.5s;
}

.popup.active {
  opacity: 1;
  pointer-events: all;
}

.popup h2 {
  color: #00ff88;
  font-size: 2rem;
  animation: glow 2s infinite alternate;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1>Happy Birthday Hero 💚</h1>

  <div class="omnitrix"></div>

  <p class="message">
    You are just like Ben 10 — strong, fearless, and always saving the day! 💥  
    May your life be full of power, adventures, and happiness! 🎉
  </p>

  <button onclick="showWish()">Activate Surprise</button>
</div>

<div class="popup" id="popup">
  <h2>It's Hero Time! 💚🔥</h2>
  <p>Happy Birthday Champion 🎂</p>
</div>

<script>
// Particle Background
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2,
    d: Math.random()*1
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff88";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  update();
}

function update(){
  particles.forEach(p=>{
    p.y += p.d;
    if(p.y > canvas.height){
      p.y = 0;
      p.x = Math.random()*canvas.width;
    }
  });
}

setInterval(draw,30);

// Popup
function showWish(){
  document.getElementById("popup").classList.add("active");
}
</script>

</body>
</html>
