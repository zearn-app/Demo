<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  overflow-x: hidden;
  background: #000;
  color: #fff;
}

/* Parallax Section */
.section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

.parallax {
  background-attachment: fixed;
  background-size: cover;
  background-position: center;
}

/* Sections Backgrounds */
.sec1 {
  background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
}
.sec2 {
  background-image: url('https://images.unsplash.com/photo-1492724441997-5dc865305da7');
}
.sec3 {
  background-image: url('https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2');
}

/* Content */
.content {
  max-width: 700px;
  padding: 20px;
  animation: fadeUp 2s ease;
}

h1 {
  font-size: 3rem;
  margin-bottom: 20px;
}

p {
  font-size: 1.2rem;
  opacity: 0.9;
}

/* Final Proposal */
.proposal {
  font-size: 2.5rem;
  color: #ff4d6d;
  margin-top: 20px;
  animation: pulse 1.5s infinite;
}

/* Animations */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* Floating Hearts */
.heart {
  position: fixed;
  bottom: -10px;
  color: #ff4d6d;
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-100vh) translateX(100px);
    opacity: 0;
  }
}

/* Button */
.btn {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  background: #ff4d6d;
  color: white;
  border-radius: 30px;
  cursor: pointer;
  font-size: 1rem;
  transition: 0.3s;
}

.btn:hover {
  background: #ff1e4d;
  transform: scale(1.1);
}
</style>
</head>

<body>

<!-- Section 1 -->
<section class="section parallax sec1">
  <div class="content">
    <h1>Hey ❤️</h1>
    <p>From the moment I saw you, everything felt different...</p>
  </div>
</section>

<!-- Section 2 -->
<section class="section parallax sec2">
  <div class="content">
    <h1>You Are Special ✨</h1>
    <p>You make my world brighter, happier, and full of love...</p>
  </div>
</section>

<!-- Section 3 -->
<section class="section parallax sec3">
  <div class="content">
    <h1>I Have Something To Say 💌</h1>
    <p>Every moment with you feels like magic...</p>
    <div class="proposal">Will You Be Mine? 💖</div>
    <button class="btn" onclick="yesClick()">Yes 💘</button>
  </div>
</section>

<script>
// Floating Hearts Generator
function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '❤';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = Math.random() * 20 + 10 + 'px';
  heart.style.animationDuration = Math.random() * 3 + 3 + 's';

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 300);

// Button Click
function yesClick() {
  alert("Aww 🥺❤️ You made me the happiest person!");
}
</script>

</body>
</html>
