<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Hero Time!</title>
    <style>
        :root {
            --ben-green: #39FF14;
            --dark-gray: #1a1a1a;
            --deep-black: #000000;
        }

        body {
            background-color: var(--deep-black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Background Circuit Animation */
        .background-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a3a1a 0%, #000 80%);
            z-index: -1;
            opacity: 0.5;
        }

        /* The Omnitrix Interface */
        .container {
            text-align: center;
            border: 4px solid var(--ben-green);
            padding: 40px;
            border-radius: 50%;
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 50px var(--ben-green), inset 0 0 30px var(--ben-green);
            background: rgba(0, 0, 0, 0.8);
            position: relative;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--ben-green); }
            50% { transform: scale(1.02); box-shadow: 0 0 70px var(--ben-green); }
        }

        h1 {
            color: var(--ben-green);
            font-size: 2.5rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 10px var(--ben-green);
            letter-spacing: 5px;
        }

        .message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            opacity: 0;
            transition: 1s ease-in;
        }

        /* DNA Loader Animation */
        .dna-scanner {
            width: 100%;
            height: 4px;
            background: var(--ben-green);
            position: absolute;
            top: 50%;
            left: 0;
            box-shadow: 0 0 15px var(--ben-green);
            animation: scan 3s infinite linear;
        }

        @keyframes scan {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }

        button {
            background: var(--ben-green);
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            border-radius: 5px;
            transition: 0.3s;
            z-index: 10;
        }

        button:hover {
            background: white;
            box-shadow: 0 0 20px white;
            transform: scale(1.1);
        }

        /* Floating Alien Silhouettes */
        .alien-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="background-lines"></div>
    
    <div class="container" id="mainContainer">
        <div class="dna-scanner"></div>
        <h1 id="title">BEN 10</h1>
        <p id="sub">DNA IDENTIFIED: BIRTHDAY BOY</p>
        
        <div class="message" id="wish">
            HAPPY BIRTHDAY!<br>
            <span style="font-size: 1.5rem;">IT'S HERO TIME!</span>
        </div>

        <button onclick="transform()">ACTIVATE OMNITRIX</button>
    </div>

    <script>
        function transform() {
            const wish = document.getElementById('wish');
            const container = document.getElementById('mainContainer');
            const title = document.getElementById('title');
            
            // Sound effect (Optional: replace with actual URL)
            const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-10.mp3');
            audio.play();

            // Change UI
            wish.style.opacity = '1';
            title.innerText = "LEVEL 10";
            container.style.borderColor = "#fff";
            container.style.boxShadow = "0 0 100px #39FF14";

            // Create "Alien Sparks"
            for(let i = 0; i < 20; i++) {
                createSpark();
            }
        }

        function createSpark() {
            const spark = document.createElement('div');
            spark.className = 'alien-icon';
            spark.innerHTML = '⚡';
            spark.style.left = Math.random() * 100 + 'vw';
            spark.style.top = '100vh';
            spark.style.color = '#39FF14';
            spark.style.fontSize = Math.random() * 30 + 10 + 'px';
            spark.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(spark);
            
            setTimeout(() => { spark.remove(); }, 5000);
        }

        // Periodic sparks for atmosphere
        setInterval(createSpark, 500);
    </script>
</body>
</html>
